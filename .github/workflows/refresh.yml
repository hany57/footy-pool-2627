
name: Refresh standings

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live standings and rebuild standings.json
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/refresh.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name "footy-pool-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/league_ids.json docs/data/standings.json
          git diff --cached --quiet || git commit -m "Auto-refresh standings"
          git push
